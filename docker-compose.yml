services:
  postgres:
    image: postgres:16.4
    container_name: production-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: production_mvp
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: postgres_admin_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d production_mvp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
